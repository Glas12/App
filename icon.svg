<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0b90b"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1a2e"/>
      <stop offset="100%" style="stop-color:#0f2035"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg2)"/>
  <!-- Gold border ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#bg)" stroke-width="6" opacity="0.4"/>
  <!-- Chart bars -->
  <rect x="80" y="300" width="60" height="140" rx="8" fill="url(#bg)" opacity="0.3"/>
  <rect x="160" y="240" width="60" height="200" rx="8" fill="url(#bg)" opacity="0.5"/>
  <rect x="240" y="180" width="60" height="260" rx="8" fill="url(#bg)" opacity="0.7"/>
  <rect x="320" y="140" width="60" height="300" rx="8" fill="url(#bg)"/>
  <rect x="400" y="100" width="60" height="340" rx="8" fill="#0ecb81"/>
  <!-- Trend line -->
  <polyline points="110,350 190,280 270,210 350,160 430,120" fill="none" stroke="#0ecb81" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- TP text -->
  <text x="256" y="90" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" fill="#f0b90b" opacity="0.15">TP</text>
</svg>
